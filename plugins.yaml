# Red Hat AI Community Plugins Registry
#
# To add a plugin, open a PR adding an entry below.
# See CONTRIBUTING.md for submission guidelines.
# See docs/plugin-spec.md for the full plugin.yaml schema.
#
# Optional fields: version, icon_url, tagline, helm_install
# These are validated when present but not required.

plugins:
  - name: brewet
    description: Technical enablement catalog and demos
    tagline: Hands-on AI enablement, ready to run
    repo: https://github.com/rh-aiservices-bu/odh-tec
    status: experimental
    maintenance: red-hat
    deployment_model: cluster-shared
    rhoai_versions: ["3.4.0"]
    maintainer: rh-aiservices-bu
    last_updated: 2026-06-24
    version: "0.1.0"
    helm_install: helm install brewet oci://quay.io/rh-ai-community-plugins/brewet-chart
    screenshot_url: screenshots/brewet.png

  - name: sardeenz
    description: Specialized visualization tools
    tagline: See your AI workloads differently
    repo: https://github.com/rh-aiservices-bu/sardeenz
    status: experimental
    maintenance: red-hat
    deployment_model: cluster-shared
    rhoai_versions: ["3.4.0"]
    maintainer: rh-aiservices-bu
    last_updated: 2026-06-24
    version: "0.1.0"
