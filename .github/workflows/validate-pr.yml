name: Validate Plugin PR

on:
  pull_request:
    paths:
      - 'plugins.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate YAML syntax
        run: python3 -c "import yaml; yaml.safe_load(open('plugins.yaml'))"

      - name: Validate required fields
        run: |
          python3 << 'EOF'
          import yaml, sys

          with open('plugins.yaml') as f:
              data = yaml.safe_load(f)

          required_fields = ['name', 'repo', 'status', 'maintenance', 'last_updated']
          valid_statuses = ['experimental', 'beta', 'stable-candidate', 'deprecated', 'archived']
          valid_maintenance = ['red-hat', 'community', 'archived']

          errors = []
          for i, plugin in enumerate(data.get('plugins', [])):
              prefix = f"Plugin #{i+1} ({plugin.get('name', 'unnamed')})"
              for field in required_fields:
                  if field not in plugin:
                      errors.append(f"{prefix}: missing required field '{field}'")
              if plugin.get('status') not in valid_statuses:
                  errors.append(f"{prefix}: invalid status '{plugin.get('status')}' (must be one of {valid_statuses})")
              if plugin.get('maintenance') not in valid_maintenance:
                  errors.append(f"{prefix}: invalid maintenance '{plugin.get('maintenance')}' (must be one of {valid_maintenance})")

          if errors:
              print("Validation errors:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          else:
              print(f"All {len(data.get('plugins', []))} plugins validated successfully.")
          EOF

      - name: Check repo links
        run: |
          python3 << 'EOF'
          import yaml, urllib.request, sys

          with open('plugins.yaml') as f:
              data = yaml.safe_load(f)

          errors = []
          for plugin in data.get('plugins', []):
              repo = plugin.get('repo', '')
              try:
                  req = urllib.request.Request(repo, method='HEAD')
                  resp = urllib.request.urlopen(req, timeout=10)
                  if resp.status >= 400:
                      errors.append(f"{plugin['name']}: repo {repo} returned HTTP {resp.status}")
              except Exception as e:
                  errors.append(f"{plugin['name']}: repo {repo} is not accessible ({e})")

          if errors:
              print("Link check warnings (non-blocking):")
              for e in errors:
                  print(f"  - {e}")
          else:
              print("All repo links accessible.")
          EOF

      - name: Cross-validate plugin.yaml from repos
        run: |
          python3 << 'EOF'
          import yaml, urllib.request, urllib.error, re, sys

          with open('plugins.yaml') as f:
              data = yaml.safe_load(f)

          required_plugin_fields = [
              'name', 'displayName', 'description', 'version', 'maintainer',
              'rhoai_compatibility', 'deployment_model', 'install', 'remote', 'rbac',
          ]
          valid_deployment_models = ['per-project', 'cluster-shared', 'both']
          valid_install_methods = ['automatic', 'assisted', 'manual']

          errors = []
          warnings = []

          for plugin in data.get('plugins', []):
              name = plugin.get('name', 'unnamed')
              repo = plugin.get('repo', '')

              match = re.match(r'https://github\.com/([^/]+/[^/]+)/?', repo)
              if not match:
                  warnings.append(f"{name}: cannot parse repo URL, skipping plugin.yaml validation")
                  continue

              raw_url = f"https://raw.githubusercontent.com/{match.group(1)}/main/plugin.yaml"
              try:
                  req = urllib.request.Request(raw_url, headers={'User-Agent': 'rh-ai-pr-validator'})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      plugin_data = yaml.safe_load(resp.read())
              except Exception as e:
                  warnings.append(f"{name}: could not fetch plugin.yaml ({e})")
                  continue

              prefix = f"{name} plugin.yaml"
              for field in required_plugin_fields:
                  if field not in plugin_data:
                      errors.append(f"{prefix}: missing required field '{field}'")

              dm = plugin_data.get('deployment_model')
              if dm and dm not in valid_deployment_models:
                  errors.append(f"{prefix}: invalid deployment_model '{dm}'")

              install = plugin_data.get('install', {})
              method = install.get('method')
              if method and method not in valid_install_methods:
                  errors.append(f"{prefix}: invalid install.method '{method}'")

              compat = plugin_data.get('rhoai_compatibility', {})
              tested = compat.get('tested_versions', [])
              if not tested:
                  errors.append(f"{prefix}: rhoai_compatibility.tested_versions must not be empty")

          if warnings:
              print("Cross-validation warnings (non-blocking):")
              for w in warnings:
                  print(f"  - {w}")

          if errors:
              print("\nCross-validation errors:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          else:
              print(f"Cross-validation passed for all plugins.")
          EOF
